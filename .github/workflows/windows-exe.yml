name: Build and Release Windows EXEs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ViModManager.slnx

      - name: Test core engine and example package
        run: dotnet test tests/ViModManager.Tests.csproj -c Release --nologo

      - name: Publish compact framework-dependent EXE
        run: >
          dotnet publish src/ViModManager.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=false -p:DebugType=None
          -o "$env:RUNNER_TEMP/vmm-light"

      - name: Publish self-contained portable EXE
        run: >
          dotnet publish src/ViModManager.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None
          -o "$env:RUNNER_TEMP/vmm-portable"

      - name: Stage the flat release folder
        shell: pwsh
        run: |
          $portable = 'publish/ViModManager.exe'
          $light = 'publish/ViModManager-light.exe'

          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item "$env:RUNNER_TEMP/vmm-portable/ViModManager.exe" $portable -Force
          Copy-Item "$env:RUNNER_TEMP/vmm-light/ViModManager.exe" $light -Force

          $lines = @()
          foreach ($file in @($portable, $light)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content 'publish/SHA256SUMS.txt' -Encoding ascii

      - name: Upload release executables
        uses: actions/upload-artifact@v4
        with:
          name: VI-Mod-Manager-Windows-EXEs
          path: |
            publish/*.exe
            publish/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download release executables
        uses: actions/download-artifact@v4
        with:
          name: VI-Mod-Manager-Windows-EXEs
          path: publish

      - name: Create GitHub release on tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "publish/ViModManager.exe" \
            "publish/ViModManager-light.exe" \
            "publish/SHA256SUMS.txt" \
            --title "VI Mod Manager ${GITHUB_REF_NAME}" \
            --notes-file 'RELEASE_NOTES.md'
